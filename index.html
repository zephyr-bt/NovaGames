<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevStash | Free Resources</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    colors: { page: '#050505', card: '#0a0a0a', border: '#222', accent: '#3b82f6' }
                }
            }
        }
    </script>
    <style>
        body { background-color: #050505; color: #fff; }
        .glass { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); backdrop-filter: blur(10px); }
        .code-block { background: #000; border: 1px solid #222; padding: 15px; border-radius: 8px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #a5b4fc; overflow-x: auto; }
        
        /* Smooth Fade In */
        .item-card { animation: fadeUp 0.5s ease-out forwards; opacity: 0; transform: translateY(20px); }
        @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <nav class="sticky top-0 z-50 bg-[#050505]/80 backdrop-blur-md border-b border-border">
        <div class="max-w-5xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2 font-bold text-xl tracking-tight">
                <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white"><i data-lucide="box" class="w-5 h-5"></i></div>
                DevStash
            </div>
            <div class="flex gap-4">
                <input id="search-bar" type="text" placeholder="Search resources..." class="hidden md:block bg-card border border-border rounded-full px-4 py-1.5 text-sm w-64 focus:border-blue-500 outline-none transition" oninput="filterItems()">
                <button onclick="toggleAdmin()" class="text-zinc-500 hover:text-white"><i data-lucide="shield" class="w-5 h-5"></i></button>
            </div>
        </div>
    </nav>

    <header class="py-20 text-center px-4 relative overflow-hidden">
        <div class="absolute inset-0 bg-[url('https://grainy-gradients.vercel.app/noise.svg')] opacity-20 pointer-events-none"></div>
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-blue-600 rounded-full blur-[150px] opacity-10 -z-10"></div>
        
        <h1 class="text-5xl md:text-6xl font-bold mb-6 bg-clip-text text-transparent bg-gradient-to-b from-white to-zinc-500">Free Developer Resources.</h1>
        <p class="text-zinc-400 max-w-lg mx-auto text-lg mb-8">Curated code snippets, UI components, and study notes for the modern web.</p>
        <div class="flex justify-center gap-3">
            <button onclick="filterCategory('all')" class="px-4 py-2 rounded-full bg-white text-black font-bold text-sm hover:scale-105 transition">All</button>
            <button onclick="filterCategory('ui')" class="px-4 py-2 rounded-full glass text-zinc-300 font-bold text-sm hover:text-white hover:bg-white/10 transition">UI Kits</button>
            <button onclick="filterCategory('func')" class="px-4 py-2 rounded-full glass text-zinc-300 font-bold text-sm hover:text-white hover:bg-white/10 transition">Functions</button>
            <button onclick="filterCategory('note')" class="px-4 py-2 rounded-full glass text-zinc-300 font-bold text-sm hover:text-white hover:bg-white/10 transition">Notes</button>
        </div>
    </header>

    <main class="flex-1 max-w-5xl mx-auto px-6 pb-20 w-full">
        <div id="grid-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="text-center col-span-full py-20 text-zinc-600">Loading stash...</div>
        </div>
    </main>

    <div id="admin-panel" class="hidden fixed inset-0 z-[60] bg-black/90 backdrop-blur flex items-center justify-center p-4">
        <div class="bg-card border border-border p-8 rounded-2xl w-full max-w-lg shadow-2xl relative">
            <button onclick="toggleAdmin()" class="absolute top-4 right-4 text-zinc-500 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            <h2 class="text-2xl font-bold mb-6">Add Resource</h2>
            
            <div class="space-y-4">
                <input id="new-title" class="w-full bg-page border border-border p-3 rounded-lg text-sm outline-none focus:border-blue-500" placeholder="Resource Title (e.g. Glass Card)">
                <select id="new-cat" class="w-full bg-page border border-border p-3 rounded-lg text-sm outline-none text-zinc-400">
                    <option value="ui">UI Component</option>
                    <option value="func">Javascript Function</option>
                    <option value="note">Study Note</option>
                </select>
                <textarea id="new-desc" class="w-full bg-page border border-border p-3 rounded-lg text-sm outline-none focus:border-blue-500" rows="2" placeholder="Short description..."></textarea>
                <textarea id="new-code" class="w-full bg-page border border-border p-3 rounded-lg text-sm font-mono outline-none focus:border-blue-500" rows="5" placeholder="Paste Code / Content here..."></textarea>
                <button onclick="addItem()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg transition">Upload to Stash</button>
            </div>
        </div>
    </div>

    <script>
        // 1. CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyCAGwej9kwnaf9XyqreS2kM9_NLpEa6dOM",
            authDomain: "nexusbio.firebaseapp.com",
            projectId: "nexusbio",
            storageBucket: "nexusbio.firebasestorage.app",
            messagingSenderId: "742997204418",
            appId: "1:742997204418:web:78084566fbdb81198c8a5b"
        };

        let db;
        let allItems = [];

        window.onload = () => {
            try {
                firebase.initializeApp(firebaseConfig);
                db = firebase.firestore();
                loadItems();
            } catch(e) { console.error(e); }
            lucide.createIcons();
        };

        // 2. LOAD
        async function loadItems() {
            const grid = document.getElementById('grid-container');
            grid.innerHTML = ''; 
            
            try {
                const snap = await db.collection("stash").orderBy("timestamp", "desc").get();
                allItems = [];
                snap.forEach(doc => {
                    allItems.push({ id: doc.id, ...doc.data() });
                });
                renderItems(allItems);
            } catch(e) {
                console.error(e);
                grid.innerHTML = `<div class="text-center col-span-full py-10 text-red-500">Failed to load data.</div>`;
            }
        }

        // 3. RENDER
        function renderItems(items) {
            const grid = document.getElementById('grid-container');
            grid.innerHTML = '';
            
            if(items.length === 0) {
                grid.innerHTML = `<div class="text-center col-span-full py-10 text-zinc-600">No resources found.</div>`;
                return;
            }

            items.forEach((item, index) => {
                const badgeColor = item.cat === 'ui' ? 'bg-purple-500/20 text-purple-400' : (item.cat === 'func' ? 'bg-blue-500/20 text-blue-400' : 'bg-green-500/20 text-green-400');
                const badgeName = item.cat === 'ui' ? 'UI' : (item.cat === 'func' ? 'JS' : 'Note');

                const card = document.createElement('div');
                card.className = 'item-card glass p-6 rounded-2xl border border-border hover:border-blue-500/50 transition group relative overflow-hidden';
                card.style.animationDelay = `${index * 0.1}s`;
                
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <div class="w-10 h-10 rounded-full ${badgeColor} flex items-center justify-center font-bold text-xs">${badgeName}</div>
                        <button onclick="copyCode('${item.id}')" class="p-2 hover:bg-white/10 rounded-lg transition text-zinc-400 hover:text-white" title="Copy Code">
                            <i data-lucide="copy" class="w-4 h-4"></i>
                        </button>
                    </div>
                    <h3 class="text-lg font-bold text-white mb-2">${item.title}</h3>
                    <p class="text-zinc-400 text-sm mb-4 line-clamp-2">${item.desc}</p>
                    <div class="bg-black/50 p-3 rounded-lg border border-white/5">
                        <pre class="text-[10px] text-zinc-500 font-mono line-clamp-3 overflow-hidden">${escapeHtml(item.code)}</pre>
                    </div>
                    <textarea id="code-${item.id}" class="hidden">${item.code}</textarea>
                `;
                grid.appendChild(card);
            });
            lucide.createIcons();
        }

        // 4. ADMIN ACTIONS
        function toggleAdmin() {
            const panel = document.getElementById('admin-panel');
            panel.classList.toggle('hidden');
        }

        async function addItem() {
            const title = document.getElementById('new-title').value;
            const cat = document.getElementById('new-cat').value;
            const desc = document.getElementById('new-desc').value;
            const code = document.getElementById('new-code').value;

            if(!title || !code) return alert("Title and Code are required!");

            try {
                await db.collection("stash").add({
                    title, cat, desc, code,
                    timestamp: new Date()
                });
                toggleAdmin();
                loadItems();
                alert("Resource Added!");
                // Clear inputs
                document.getElementById('new-title').value = '';
                document.getElementById('new-desc').value = '';
                document.getElementById('new-code').value = '';
            } catch(e) {
                alert("Error: " + e.message);
            }
        }

        // 5. UTILS
        function copyCode(id) {
            const code = document.getElementById(`code-${id}`).value;
            navigator.clipboard.writeText(code);
            alert("Code Copied to Clipboard!");
        }

        function filterCategory(cat) {
            if(cat === 'all') renderItems(allItems);
            else renderItems(allItems.filter(i => i.cat === cat));
        }

        function filterItems() {
            const term = document.getElementById('search-bar').value.toLowerCase();
            const filtered = allItems.filter(i => i.title.toLowerCase().includes(term) || i.desc.toLowerCase().includes(term));
            renderItems(filtered);
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
